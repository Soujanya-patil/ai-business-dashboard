<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AI Business Dashboard</title>
<style>
  :root {
    --bg: light-dark(#f7f7f5, #1b1b1a);
    --card-bg: light-dark(#ffffff, #262625);
    --border: light-dark(#e6e4df, #3a3937);
    --text: light-dark(#20201e, #f0efec);
    --text-muted: light-dark(#6b6a66, #a3a29d);
    --accent: light-dark(#c15f3c, #e08a63);
    --accent-bg: light-dark(#fbeee7, #3a2a22);
    --critical: #c0392b;
    --high: #d68910;
    --medium: #7d8c4a;
    --low: #6b6a66;
    --open: #b8560f;
    --resolved: #4c7a4c;
    --unconfirmed: #9a6b1f;
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .meta { font-size: 11px; color: var(--text-muted); }
  button {
    font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  .tabbar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tabbar button {
    border: none; border-radius: 0; background: transparent; padding: 8px 4px; margin-right: 16px;
    font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; position: relative; top: 1px;
  }
  .tabbar button:hover { color: var(--text); border-color: var(--border); }
  .tabbar button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpis-compact { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); margin-bottom: 10px; }
  .kpi { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .kpi .value { font-size: 22px; font-weight: 600; }
  .kpis-compact .kpi .value { font-size: 17px; }
  .kpi .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; }
  td { white-space: normal; }
  th { color: var(--text-muted); font-weight: 500; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tr:last-child > td { border-bottom: none; }
  .empty { color: var(--text-muted); font-style: italic; padding: 6px 0; }
  .empty-panel {
    color: var(--text-muted); font-style: italic; text-align: center; padding: 28px 12px;
    border: 1px dashed var(--border); border-radius: 8px;
  }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #fff; }
  .pill.Critical { background: var(--critical); }
  .pill.High { background: var(--high); }
  .pill.Medium { background: var(--medium); }
  .pill.Low { background: var(--low); }
  .status { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .status.Open { color: var(--open); }
  .status.Resolved { color: var(--resolved); }
  .status.Unconfirmed { color: var(--unconfirmed); }
  .status.Pending { color: var(--unconfirmed); }
  .status.Monitoring { color: var(--text-muted); }
  .chipbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; }
  .chip b { color: var(--text); }
  .sourcebadge { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); }

  .filterbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
  .filter { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--text-muted); }
  .filter select {
    font: inherit; font-size: 12px; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); min-width: 120px;
  }
  .clickable-row { cursor: pointer; }
  .clickable-row:hover > td { background: var(--accent-bg); }
  .detail-row > td { background: var(--bg); padding: 10px 12px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 16px; white-space: normal; }
  .detail-field { display: flex; flex-direction: column; gap: 2px; }
  .detail-label { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); }
  .detail-value { font-size: 12px; }
  .resultcount { color: var(--text-muted); margin-top: 8px; }

  .attention-list { display: flex; flex-direction: column; gap: 8px; }
  .attention-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
  .attention-head { margin-bottom: 4px; }
  .attention-detail { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .attention-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .attention-action { font-size: 11px; color: var(--accent); font-weight: 600; }

  #root.loading { opacity: .5; }
  #error { color: var(--critical); padding: 8px 0; display: none; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>AI Business Dashboard</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="meta" id="updated-at"></span>
      <button id="refresh-btn">Refresh</button>
    </div>
  </div>
  <div id="error"></div>
  <div class="tabbar" id="tabbar">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="monitoring">Monitoring</button>
    <button data-tab="accounting">Accounting</button>
  </div>
  <div id="root" class="loading">
    <div class="empty">Waiting for dashboard data…</div>
  </div>

<script>
(function () {
  "use strict";

  // ---- MCP Apps host bridge -------------------------------------------
  // This page runs inside a sandboxed iframe. It never talks to Google
  // Sheets, Anthropic, or any external API directly - it only exchanges
  // JSON-RPC messages with the host window via postMessage, per the
  // MCP Apps extension (io.modelcontextprotocol/ui). The host is the one
  // holding real credentials; this page only ever sees the already-
  // computed dashboard JSON the get_business_dashboard tool returns.
  var TOOL_NAME = "get_business_dashboard";
  var nextId = 1;
  var pending = {};

  function send(payload) {
    window.parent.postMessage(payload, "*");
  }

  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      send({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  function notify(method, params) {
    send({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    if (msg.id !== undefined && pending[msg.id]) {
      var callbacks = pending[msg.id];
      delete pending[msg.id];
      if (msg.error) {
        callbacks.reject(new Error(msg.error.message || "MCP request failed"));
      } else {
        callbacks.resolve(msg.result);
      }
      return;
    }

    if (msg.method === "ui/notifications/tool-result") {
      handleToolResult(msg.params);
    }
  });

  function initialize() {
    request("ui/initialize", {
      appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      clientInfo: { name: "AI Business Dashboard", version: "1.0.0" },
      protocolVersion: "2026-01-26",
    })
      .then(function (result) {
        applyHostTheme(result && result.hostContext);
        notify("ui/notifications/initialized");
        // A host that opened this view already carrying this call's
        // result delivers it via ui/notifications/tool-result right
        // after initialization - render() below waits for that. If this
        // view was opened with no prior tool call (e.g. reopened later),
        // proactively ask for fresh data instead of sitting empty.
        if (result && result.hostContext && !result.hostContext.toolInfo) {
          refresh();
        }
      })
      .catch(function (err) {
        showError("Could not initialize dashboard: " + err.message);
      });
  }

  function applyHostTheme(hostContext) {
    if (!hostContext) return;
    if (hostContext.theme) {
      document.documentElement.setAttribute("data-theme", hostContext.theme);
    }
    var vars = hostContext.styles && hostContext.styles.variables;
    if (vars) {
      Object.keys(vars).forEach(function (key) {
        document.documentElement.style.setProperty(key, vars[key]);
      });
    }
  }

  function handleToolResult(params) {
    if (!params) return;
    var data = params.structuredContent;
    if (!data) {
      showError("Tool result had no structured dashboard data.");
      return;
    }
    render(data);
  }

  function refresh() {
    var btn = document.getElementById("refresh-btn");
    var root = document.getElementById("root");
    btn.disabled = true;
    root.classList.add("loading");
    request("tools/call", { name: TOOL_NAME, arguments: {} })
      .then(function (result) {
        if (result && result.structuredContent) {
          render(result.structuredContent);
        } else {
          showError("Refresh returned no structured data.");
        }
      })
      .catch(function (err) {
        showError("Refresh failed: " + err.message);
      })
      .finally(function () {
        btn.disabled = false;
        root.classList.remove("loading");
      });
  }

  document.getElementById("refresh-btn").addEventListener("click", refresh);

  function showError(message) {
    var el = document.getElementById("error");
    el.textContent = message;
    el.style.display = message ? "block" : "none";
  }

  // ---- Interactive UI state -----------------------------------------------
  // Every dashboard invocation delivers a FRESH structuredContent payload
  // (see render() at the bottom) - `state.data` is just the most recently
  // received copy, held only so tab-switching/filtering/sorting can
  // re-render instantly without another round trip. It is replaced
  // wholesale on every refresh/tool-result, never merged or persisted -
  // Google Sheets stays the only place this data actually lives.
  var state = {
    data: null,
    tab: "overview",
    monFilters: { date: "", priority: "", status: "", category: "" },
    monSort: { col: "date", dir: "desc" },
    monExpanded: null,
    accFilters: { date: "", record_type: "", priority: "", status: "" },
    accSort: { col: "date", dir: "desc" },
    accExpanded: null,
  };

  // ---- Rendering ---------------------------------------------------------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtAmount(v) {
    if (v === "" || v === null || v === undefined) return "—";
    var n = Number(v);
    if (isNaN(n)) return esc(v);
    return "₹" + n.toLocaleString("en-IN");
  }

  function pill(priority) {
    if (!priority) return "";
    return '<span class="pill ' + esc(priority) + '">' + esc(priority) + "</span>";
  }

  function statusTag(status) {
    if (!status) return "";
    return '<span class="status ' + esc(status) + '">' + esc(status) + "</span>";
  }

  function table(headers, rows, rowToCells, emptyMessage) {
    if (!rows || rows.length === 0) {
      return '<div class="empty">' + esc(emptyMessage || "No data.") + "</div>";
    }
    var head = "<tr>" + headers.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr>";
    var body = rows.map(function (r) { return "<tr>" + rowToCells(r).join("") + "</tr>"; }).join("");
    return '<div class="tablewrap"><table>' + head + body + "</table></div>";
  }

  function td(v) { return "<td>" + esc(v) + "</td>"; }

  function kpi(value, label) {
    return '<div class="kpi"><div class="value">' + esc(value) + '</div><div class="label">' + esc(label) + "</div></div>";
  }

  function chipbar(counts) {
    var keys = Object.keys(counts || {});
    if (keys.length === 0) return '<div class="empty">None.</div>';
    return (
      '<div class="chipbar">' +
      keys.map(function (k) { return '<div class="chip"><b>' + esc(counts[k]) + "</b> " + esc(k) + "</div>"; }).join("") +
      "</div>"
    );
  }

  function emptyPanel(message) {
    return '<div class="empty-panel">' + esc(message) + "</div>";
  }

  // DD.MM.YYYY -> a comparable number (YYYYMMDD). Never assumes/derives
  // "today" - purely reorders whatever date strings are actually present.
  function dateSortKey(s) {
    if (!s) return 0;
    var parts = String(s).split(".");
    if (parts.length !== 3) return 0;
    var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
    if (isNaN(d) || isNaN(m) || isNaN(y)) return 0;
    return y * 10000 + m * 100 + d;
  }

  var PRIORITY_ORDER = { Critical: 0, High: 1, Medium: 2, Low: 3 };
  function priorityRank(p) {
    return PRIORITY_ORDER.hasOwnProperty(p) ? PRIORITY_ORDER[p] : 4;
  }

  function distinctValues(records, field) {
    var seen = {};
    records.forEach(function (r) { if (r[field]) seen[r[field]] = true; });
    return Object.keys(seen).sort();
  }

  function sortIndicator(col, sortState) {
    if (sortState.col !== col) return "";
    return sortState.dir === "asc" ? " ↑" : " ↓";
  }

  function filterSelectHtml(filterKey, label, options, current) {
    var opts = '<option value="">All</option>' +
      options.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === current ? " selected" : "") + ">" + esc(o) + "</option>";
      }).join("");
    return (
      '<label class="filter"><span>' + esc(label) + '</span>' +
      '<select data-filter="' + esc(filterKey) + '">' + opts + "</select></label>"
    );
  }

  // Present (not null/undefined) is the test for whether a KPI derived
  // from "today"/"the latest date" is shown at all - a real computed 0 is
  // still shown (e.g. "Resolved Today: 0"), only genuinely absent data
  // (no dated rows to compute from) omits the card entirely.
  function isKnown(v) {
    return v !== null && v !== undefined;
  }

  function renderOverview(o) {
    var cash = o.cash_position || {};
    var cashClosing = cash["Closing balance"];
    return (
      '<div class="kpis">' +
      kpi(o.total_open_issues, "Open Issues") +
      kpi(o.critical_high_issues, "Critical / High") +
      (isKnown(o.resolved_today) ? kpi(o.resolved_today, "Resolved Today") : "") +
      kpi(o.needs_attention_count, "Total Attention Items") +
      kpi(o.accounting_exceptions, "Accounting Exceptions") +
      kpi(fmtAmount(o.sales_total), "Sales") +
      kpi(fmtAmount(o.purchase_total), "Purchases") +
      (isKnown(o.payments_total) ? kpi(fmtAmount(o.payments_total), "Payments") : "") +
      (o.outstanding_receivables_total ? kpi(fmtAmount(o.outstanding_receivables_total), "Outstanding Receivables") : "") +
      (cashClosing ? kpi(fmtAmount(cashClosing), "Cash Balance (" + esc(cash.as_of || "") + ")") : "") +
      "</div>"
    );
  }

  function sparkline(points) {
    var max = Math.max.apply(null, points.map(function (p) { return p.open_issues; }).concat([1]));
    var w = 260, h = 48, step = points.length > 1 ? w / (points.length - 1) : 0;
    var coords = points.map(function (p, i) {
      var x = i * step;
      var y = h - (p.open_issues / max) * h;
      return x + "," + y;
    });
    var last = points[points.length - 1];
    return (
      '<svg width="' + w + '" height="' + (h + 16) + '" style="overflow:visible">' +
      '<polyline points="' + coords.join(" ") + '" fill="none" stroke="var(--accent)" stroke-width="2" />' +
      '<text x="0" y="' + (h + 14) + '" font-size="10" fill="var(--text-muted)">' + esc(points[0].date) + "</text>" +
      '<text x="' + w + '" y="' + (h + 14) + '" font-size="10" fill="var(--text-muted)" text-anchor="end">' + esc(last.date) + " (" + last.open_issues + ")</text>" +
      "</svg>"
    );
  }

  function renderMonitoringSnapshot(m) {
    if (m.total_rows === 0) {
      return '<div class="card"><h2>Monitoring</h2>' + emptyPanel("No monitoring data available yet.") + "</div>";
    }
    var trend = m.open_issues_trend && m.open_issues_trend.length > 1 ? sparkline(m.open_issues_trend) : "";
    return (
      '<div class="card"><h2>Monitoring</h2>' +
      '<div class="kpis kpis-compact">' +
      kpi(m.total_open_issues, "Open") +
      kpi(m.resolved_count, "Resolved") +
      kpi(m.critical_high_count, "Critical / High") +
      kpi(m.total_rows, "Total") +
      "</div>" +
      chipbar(m.by_priority) +
      (trend ? '<div style="margin-top:10px;">' + trend + "</div>" : "") +
      "</div>"
    );
  }

  function renderAccountingSnapshot(a) {
    if (a.total_rows === 0) {
      return '<div class="card"><h2>Accounting</h2>' + emptyPanel("No accounting data available yet.") + "</div>";
    }
    var cash = a.cash_position || {};
    return (
      '<div class="card"><h2>Accounting</h2>' +
      '<div class="kpis kpis-compact">' +
      kpi(fmtAmount(a.sales_total), "Sales") +
      kpi(fmtAmount(a.purchase_total), "Purchase") +
      kpi(a.pending_items.length, "Pending") +
      (cash.as_of ? kpi(fmtAmount(cash["Closing balance"]), "Cash (" + esc(cash.as_of) + ")") : "") +
      "</div>" +
      chipbar(a.by_record_type) +
      "</div>"
    );
  }

  // WHAT (label/detail) / Priority+Status / ACTION - one glanceable card
  // per item instead of a dense table, per the owner-view brief. Every
  // field here is read straight off the item the server already built
  // (see dashboard_service._build_needs_attention) - nothing is composed
  // or inferred in this function.
  function renderNeedsAttention(items) {
    if (!items || items.length === 0) {
      return '<div class="empty">Nothing needs attention right now.</div>';
    }
    return (
      '<div class="attention-list">' +
      items.map(function (r) {
        return (
          '<div class="attention-card">' +
          '<div class="attention-head"><span class="sourcebadge">' + esc(r.source) + "</span> <b>" + esc(r.label) + "</b></div>" +
          (r.detail ? '<div class="attention-detail">' + esc(r.detail) + "</div>" : "") +
          '<div class="attention-meta">' +
          pill(r.priority) + statusTag(r.status) +
          (r.action ? '<span class="attention-action">Action: ' + esc(r.action) + "</span>" : "") +
          "</div>" +
          "</div>"
        );
      }).join("") +
      "</div>"
    );
  }

  // ---- What Changed Today / Patterns & Risks / Required Actions -----------
  function fmtChange(change) {
    if (!change) return "";
    var sign = change.delta > 0 ? "+" : "";
    return fmtAmount(change.latest) + " (" + sign + fmtAmount(change.delta) + " vs " + esc(change.previous_date) + ")";
  }

  function renderWhatChanged(wc) {
    if (!wc || (!wc.monitoring_date && !wc.accounting_date)) {
      return '<div class="empty">Not enough dated data yet to show what changed.</div>';
    }
    var chips = [];
    if (wc.monitoring_date) {
      chips.push(["Monitoring as of", wc.monitoring_date]);
      chips.push(["New / Open Issues Today", wc.new_open_issues]);
      chips.push(["Resolved Today", wc.resolved_issues]);
      chips.push(["New Critical / High Today", wc.new_critical_high]);
    }
    if (wc.accounting_date) {
      chips.push(["Accounting as of", wc.accounting_date]);
      chips.push(["New Exceptions Today", wc.new_accounting_exceptions]);
    }
    var html = '<div class="chipbar">' + chips.map(function (c) {
      return '<div class="chip"><b>' + esc(c[1]) + "</b> " + esc(c[0]) + "</div>";
    }).join("") + "</div>";

    var changeLines = [];
    if (wc.sales_change) changeLines.push(["Sales", wc.sales_change]);
    if (wc.purchase_change) changeLines.push(["Purchases", wc.purchase_change]);
    if (wc.payments_change) changeLines.push(["Payments", wc.payments_change]);
    if (changeLines.length) {
      html += '<div class="chipbar" style="margin-top:8px;">' + changeLines.map(function (c) {
        return '<div class="chip"><b>' + esc(c[0]) + ":</b> " + esc(fmtChange(c[1])) + "</div>";
      }).join("") + "</div>";
    }
    return html;
  }

  function renderPatterns(patterns) {
    if (!patterns || patterns.length === 0) {
      return '<div class="empty">No recurring patterns or risks identified from the current data.</div>';
    }
    return table(
      ["Pattern", "Details"],
      patterns,
      function (p) { return ['<td><span class="sourcebadge">' + esc(p.category) + "</span></td>", td(p.description)]; },
      "No recurring patterns or risks identified from the current data."
    );
  }

  function renderRequiredActions(actions) {
    return table(
      ["Source", "Item", "Action", "Priority", "Status"],
      actions,
      function (r) {
        return [
          '<td><span class="sourcebadge">' + esc(r.source) + "</span></td>",
          td(r.label),
          td(r.action),
          "<td>" + pill(r.priority) + "</td>",
          "<td>" + statusTag(r.status) + "</td>",
        ];
      },
      "No outstanding actions right now."
    );
  }

  function renderRecentActivity(ra) {
    var mon = table(
      ["Date", "Site", "Issue", "Status"],
      ra.monitoring,
      function (r) { return [td(r.date), td(r.site), td(r.issue), "<td>" + statusTag(r.status) + "</td>"]; },
      "No recent monitoring activity."
    );
    var acc = table(
      ["Date", "Type", "Entity/Description", "Amount"],
      ra.accounting,
      function (r) { return [td(r.date), td(r.record_type), td(r.entity || r.description), td(fmtAmount(r.amount))]; },
      "No recent accounting activity."
    );
    return '<div class="grid2"><div><h2>Monitoring</h2>' + mon + "</div><div><h2>Accounting</h2>" + acc + "</div></div>";
  }

  function renderOverviewTab(data) {
    return (
      renderOverview(data.overview) +
      '<div class="card"><h2>Needs My Attention</h2>' + renderNeedsAttention(data.needs_attention) + "</div>" +
      '<div class="card"><h2>What Changed Today</h2>' + renderWhatChanged(data.what_changed) + "</div>" +
      '<div class="card"><h2>Patterns &amp; Risks</h2>' + renderPatterns(data.patterns_risks) + "</div>" +
      '<div class="card"><h2>Required Actions</h2>' + renderRequiredActions(data.required_actions) + "</div>" +
      '<div class="grid2">' + renderMonitoringSnapshot(data.monitoring) + renderAccountingSnapshot(data.accounting) + "</div>" +
      '<div class="card"><h2>Recent Activity</h2>' + renderRecentActivity(data.recent_activity) + "</div>"
    );
  }

  // ---- Monitoring tab: filter + sort + click-to-inspect -------------------
  // Owner view: the main table shows only the 5 columns a founder actually
  // scans (Site/Issue/Priority/Status/Next Action) - MON_DETAIL_COLUMNS
  // still carries all 10 raw schema fields, shown in full when a row is
  // clicked open. The underlying Sheet row/schema is untouched either way;
  // this is purely which fields this view surfaces up front.
  var MON_TABLE_COLUMNS = [
    ["site", "Site"], ["issue", "Issue"], ["priority", "Priority"], ["status", "Status"], ["next_action", "Next Action"],
  ];
  var MON_DETAIL_COLUMNS = [
    ["date", "Date"], ["site", "Site"], ["issue", "Issue"], ["category", "Category"],
    ["priority", "Priority"], ["status", "Status"], ["days_open", "Days Open"],
    ["action_taken", "Action Taken"], ["next_action", "Next Action"], ["vendor", "Vendor"],
  ];

  function monComparator(col) {
    if (col === "date") return function (a, b) { return dateSortKey(a.date) - dateSortKey(b.date); };
    if (col === "priority") return function (a, b) { return priorityRank(a.priority) - priorityRank(b.priority); };
    if (col === "days_open") return function (a, b) { return (parseFloat(a.days_open) || -1) - (parseFloat(b.days_open) || -1); };
    return function (a, b) { return String(a[col] || "").localeCompare(String(b[col] || "")); };
  }

  function applyFilters(records, filters) {
    var keys = Object.keys(filters);
    return records.filter(function (r) {
      return keys.every(function (k) { return !filters[k] || r[k] === filters[k]; });
    });
  }

  function sortRecords(records, sortState, comparator) {
    var sorted = records.slice().sort(comparator);
    if (sortState.dir === "desc") sorted.reverse();
    return sorted;
  }

  function renderMonDetail(r) {
    return (
      '<div class="detail-grid">' +
      MON_DETAIL_COLUMNS.map(function (c) {
        return (
          '<div class="detail-field"><span class="detail-label">' + esc(c[1]) +
          '</span><span class="detail-value">' + esc(r[c[0]] || "—") + "</span></div>"
        );
      }).join("") +
      "</div>"
    );
  }

  function renderMonitoringTab(m) {
    if (m.total_rows === 0) {
      return '<div class="card">' + emptyPanel("No monitoring data available yet.") + "</div>";
    }

    var filterBar =
      '<div class="filterbar">' +
      filterSelectHtml("date", "Date", distinctValues(m.records, "date").sort(function (a, b) { return dateSortKey(a) - dateSortKey(b); }), state.monFilters.date) +
      filterSelectHtml("priority", "Priority", distinctValues(m.records, "priority"), state.monFilters.priority) +
      filterSelectHtml("status", "Status", distinctValues(m.records, "status"), state.monFilters.status) +
      filterSelectHtml("category", "Category", distinctValues(m.records, "category"), state.monFilters.category) +
      "</div>";

    var filtered = applyFilters(m.records, state.monFilters);
    var sorted = sortRecords(filtered, state.monSort, monComparator(state.monSort.col));

    var head = "<tr>" + MON_TABLE_COLUMNS.map(function (c) {
      return '<th class="sortable" data-sort-col="' + c[0] + '">' + esc(c[1]) + sortIndicator(c[0], state.monSort) + "</th>";
    }).join("") + "</tr>";

    var body;
    if (sorted.length === 0) {
      body = '<tr><td colspan="' + MON_TABLE_COLUMNS.length + '" class="empty">No monitoring records match the selected filters.</td></tr>';
    } else {
      body = sorted.map(function (r, i) {
        var row =
          '<tr class="clickable-row" data-row-idx="' + i + '">' +
          td(r.site) + td(r.issue) +
          "<td>" + pill(r.priority) + "</td>" + "<td>" + statusTag(r.status) + "</td>" +
          td(r.next_action) +
          "</tr>";
        if (state.monExpanded === i) {
          row += '<tr class="detail-row"><td colspan="' + MON_TABLE_COLUMNS.length + '">' + renderMonDetail(r) + "</td></tr>";
        }
        return row;
      }).join("");
    }

    return (
      filterBar +
      '<div class="tablewrap"><table>' + head + body + "</table></div>" +
      '<div class="resultcount">' + sorted.length + " of " + m.records.length + " record(s) shown" + (sorted.length ? " — click a row for details" : "") + "</div>"
    );
  }

  // ---- Accounting tab: filter + sort + click-to-inspect --------------------
  // Same owner-view split as Monitoring: main table shows only the 6
  // decision-relevant columns; ACC_DETAIL_COLUMNS (all 10 raw schema
  // fields) is shown in full on click. Sheet schema is untouched.
  var ACC_TABLE_COLUMNS = [
    ["entity", "Entity"], ["description", "Description"], ["amount", "Amount"],
    ["priority", "Priority"], ["status", "Status"], ["recommended_action", "Recommended Action"],
  ];
  var ACC_DETAIL_COLUMNS = [
    ["date", "Date"], ["record_type", "Record Type"], ["entity", "Entity"], ["description", "Description"],
    ["amount", "Amount"], ["count", "Count"], ["priority", "Priority"], ["status", "Status"],
    ["recommended_action", "Recommended Action"], ["risk_tax_flag", "Risk / Tax Flag"],
  ];

  function accComparator(col) {
    if (col === "date") return function (a, b) { return dateSortKey(a.date) - dateSortKey(b.date); };
    if (col === "priority") return function (a, b) { return priorityRank(a.priority) - priorityRank(b.priority); };
    if (col === "amount" || col === "count") return function (a, b) { return (parseFloat(a[col]) || -Infinity) - (parseFloat(b[col]) || -Infinity); };
    return function (a, b) { return String(a[col] || "").localeCompare(String(b[col] || "")); };
  }

  function renderAccDetail(r) {
    return (
      '<div class="detail-grid">' +
      ACC_DETAIL_COLUMNS.map(function (c) {
        var v = c[0] === "amount" ? fmtAmount(r[c[0]]) : (r[c[0]] || "—");
        return (
          '<div class="detail-field"><span class="detail-label">' + esc(c[1]) +
          '</span><span class="detail-value">' + esc(v) + "</span></div>"
        );
      }).join("") +
      "</div>"
    );
  }

  function renderAccountingTab(a) {
    if (a.total_rows === 0) {
      return '<div class="card">' + emptyPanel("No accounting data available yet.") + "</div>";
    }

    var filterBar =
      '<div class="filterbar">' +
      filterSelectHtml("date", "Date", distinctValues(a.records, "date").sort(function (x, y) { return dateSortKey(x) - dateSortKey(y); }), state.accFilters.date) +
      filterSelectHtml("record_type", "Record Type", distinctValues(a.records, "record_type"), state.accFilters.record_type) +
      filterSelectHtml("priority", "Priority", distinctValues(a.records, "priority"), state.accFilters.priority) +
      filterSelectHtml("status", "Status", distinctValues(a.records, "status"), state.accFilters.status) +
      "</div>";

    var filtered = applyFilters(a.records, state.accFilters);
    var sorted = sortRecords(filtered, state.accSort, accComparator(state.accSort.col));

    var head = "<tr>" + ACC_TABLE_COLUMNS.map(function (c) {
      return '<th class="sortable" data-sort-col="' + c[0] + '">' + esc(c[1]) + sortIndicator(c[0], state.accSort) + "</th>";
    }).join("") + "</tr>";

    var body;
    if (sorted.length === 0) {
      body = '<tr><td colspan="' + ACC_TABLE_COLUMNS.length + '" class="empty">No accounting records match the selected filters.</td></tr>';
    } else {
      body = sorted.map(function (r, i) {
        var row =
          '<tr class="clickable-row" data-row-idx="' + i + '">' +
          td(r.entity) + td(r.description) + td(fmtAmount(r.amount)) +
          "<td>" + pill(r.priority) + "</td>" + "<td>" + statusTag(r.status) + "</td>" +
          td(r.recommended_action) +
          "</tr>";
        if (state.accExpanded === i) {
          row += '<tr class="detail-row"><td colspan="' + ACC_TABLE_COLUMNS.length + '">' + renderAccDetail(r) + "</td></tr>";
        }
        return row;
      }).join("");
    }

    return (
      filterBar +
      '<div class="tablewrap"><table>' + head + body + "</table></div>" +
      '<div class="resultcount">' + sorted.length + " of " + a.records.length + " record(s) shown" + (sorted.length ? " — click a row for details" : "") + "</div>"
    );
  }

  // ---- Tab plumbing --------------------------------------------------------
  function renderTab() {
    if (!state.data) return;
    var root = document.getElementById("root");
    if (state.tab === "monitoring") root.innerHTML = renderMonitoringTab(state.data.monitoring);
    else if (state.tab === "accounting") root.innerHTML = renderAccountingTab(state.data.accounting);
    else root.innerHTML = renderOverviewTab(state.data);
  }

  document.querySelectorAll("#tabbar button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.tab = btn.dataset.tab;
      document.querySelectorAll("#tabbar button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderTab();
    });
  });

  // Event delegation on #root: filter <select> changes and clicks (sortable
  // headers, row expand/collapse) are both handled here instead of
  // re-attaching listeners after every innerHTML rebuild.
  document.getElementById("root").addEventListener("change", function (e) {
    var el = e.target;
    if (el.tagName !== "SELECT" || !el.dataset.filter) return;
    var filters = state.tab === "monitoring" ? state.monFilters : state.accFilters;
    filters[el.dataset.filter] = el.value;
    if (state.tab === "monitoring") state.monExpanded = null; else state.accExpanded = null;
    renderTab();
  });

  document.getElementById("root").addEventListener("click", function (e) {
    var th = e.target.closest("th[data-sort-col]");
    if (th) {
      var sortState = state.tab === "monitoring" ? state.monSort : state.accSort;
      var col = th.dataset.sortCol;
      if (sortState.col === col) sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
      else { sortState.col = col; sortState.dir = "asc"; }
      if (state.tab === "monitoring") state.monExpanded = null; else state.accExpanded = null;
      renderTab();
      return;
    }
    var row = e.target.closest("tr[data-row-idx]");
    if (row) {
      var idx = Number(row.dataset.rowIdx);
      if (state.tab === "monitoring") state.monExpanded = state.monExpanded === idx ? null : idx;
      else state.accExpanded = state.accExpanded === idx ? null : idx;
      renderTab();
    }
  });

  function render(data) {
    showError("");
    state.data = data;
    document.getElementById("updated-at").textContent =
      "Live from Google Sheets · " + (data.overview.monitoring_row_count + data.overview.accounting_row_count) + " rows";
    document.getElementById("root").classList.remove("loading");
    renderTab();
  }

  initialize();
})();
</script>
</body>
</html>
